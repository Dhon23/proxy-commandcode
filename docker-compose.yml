services:
  proxy:
    build: .
    container_name: commandcode-proxy
    restart: unless-stopped
    ports:
      - "${PCMC_PORT:-3456}:3456"
    environment:
      - PCMC_PORT=${PCMC_PORT:-3456}
      - PCMC_VERSION=${PCMC_VERSION:-0.41.1}
      - PCMC_ENV=production
      - PCMC_RATE_LIMIT_RPM=${PCMC_RATE_LIMIT_RPM:-15}
      - PCMC_RATE_LIMIT_TPM=${PCMC_RATE_LIMIT_TPM:-600000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3456/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
